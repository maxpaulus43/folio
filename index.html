<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folio — resume studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.20/build/pdfmake.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js"></script>
<style>
:root{
  --bg:#E6EAEE; --panel:#FFFFFF; --panel2:#F3F5F7; --ink:#15212C; --muted:#5F6B76; --line:#D3D9DF;
  --accent:#0F6C64; --accent-ink:#FFFFFF; --accent-soft:#DDEDEA;
  --ai:#6A3FBF; --ai-soft:#EEE8FA; --warn:#B5541B; --warn-soft:#FBEEE4; --ok:#2C7A4B;
  --paper:#FFFFFF; --paper-ink:#1B1B1B; --shadow:0 12px 40px rgba(20,33,44,.14);
  --radius:10px; --ui:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1519; --panel:#171F26; --panel2:#1F2830; --ink:#E6EBEF; --muted:#97A3AE; --line:#2A353F;
  --accent:#3FB3A6; --accent-ink:#0B1F1D; --accent-soft:#173A36; --ai:#B197F0; --ai-soft:#2A2340;
  --warn:#F0A36B; --warn-soft:#3A2618; --ok:#63C48A; --shadow:0 12px 40px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0F1519; --panel:#171F26; --panel2:#1F2830; --ink:#E6EBEF; --muted:#97A3AE; --line:#2A353F;
  --accent:#3FB3A6; --accent-ink:#0B1F1D; --accent-soft:#173A36; --ai:#B197F0; --ai-soft:#2A2340;
  --warn:#F0A36B; --warn-soft:#3A2618; --ok:#63C48A; --shadow:0 12px 40px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
.pv-accent{width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer}
@media (min-width:1181px){.pv-accent{display:none}}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- shell ---- */
.shell{height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand .mark{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand .tag{color:var(--muted);font-size:12.5px}
.score{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);cursor:pointer;font-size:13px}
.score b{font-variant-numeric:tabular-nums}
.ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--accent) var(--pct,0%),var(--line) 0);display:grid;place-items:center}
.ring::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--panel2)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ai{background:var(--ai-soft);color:var(--ai);border-color:transparent}
.btn.ai:hover{filter:brightness(.97)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.icon{padding:5px 7px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.danger{color:var(--warn)}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:220px;padding:6px;display:none;z-index:30}
.menu.open .menu-list{display:block}
.menu-list button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:9px 10px;border:0;background:transparent;border-radius:7px;cursor:pointer}
.menu-list button:hover{background:var(--panel2)}
.menu-list button small{color:var(--muted);margin-left:auto}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:6px 0}

/* ---- workspace ---- */
.work{flex:1;min-height:0;display:grid;grid-template-columns:232px minmax(360px,1fr) minmax(420px,1.1fr);gap:0}
.rail{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 10px}
.rail h4{margin:8px 8px 6px;font-size:11.5px;font-weight:500;color:var(--muted)}
.rail .sec{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:8px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.rail .sec:hover{background:var(--panel2)}
.rail .sec.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.rail .sec .n{flex:1}
.rail .sec .cnt{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.rail .sec .eye{opacity:.55;background:none;border:0;padding:2px 4px;cursor:pointer;border-radius:4px}
.rail .sec .eye:hover{opacity:1;background:var(--panel)}
.rail .sec.hidden-sec .n{text-decoration:line-through;opacity:.6}
.rail .mv{display:flex;flex-direction:column;gap:0;opacity:0}
.rail .sec:hover .mv{opacity:.7}
.rail .mv button{border:0;background:none;padding:0 3px;line-height:.8;font-size:10px;cursor:pointer}
.rail .style-box{margin:14px 8px 0;padding-top:12px;border-top:1px solid var(--line)}
.rail .row{display:flex;gap:6px;align-items:center;margin:6px 0}
.rail .row label{flex:1;font-size:13px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch.on{border-color:var(--ink)}

.editor{overflow:auto;padding:22px 26px 90px}
.editor h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;font-family:"Spectral",Georgia,serif}
.editor .head{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.editor .head p{margin:2px 0 0;color:var(--muted);flex-basis:100%}
.editor .head .acts{margin-left:auto;display:flex;gap:8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card.entry .ehead{display:flex;align-items:center;gap:8px;margin:-4px -4px 10px}
.card.entry .ehead .title{flex:1;font-weight:500}
.card.entry .ehead .title span{color:var(--muted);font-weight:400}
.card.entry .ehead .title:empty::before{content:"New entry";color:var(--muted)}
.card.entry.collapsed .body{display:none}
.card.entry.off{border-style:dashed}
.card.entry.off .title{opacity:.5;text-decoration:line-through}
.bullet .mv{display:flex;flex-direction:column;gap:2px;margin-top:3px}
.bullet .mv button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:10px;line-height:1;padding:3px 4px;border-radius:4px}
.bullet .mv button:hover{background:var(--panel2);color:var(--ink)}
.bullet .mv button[disabled]{opacity:.25;cursor:default}
.arr{display:flex;align-items:center;gap:8px;padding:10px 6px;border-bottom:1px solid var(--line)}
.arr:last-child{border:0}
.arr .n{flex:1}
.arr.off .n{opacity:.5;text-decoration:line-through}
.fit{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:14px}
.fit .big{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px;flex:none;color:var(--ink)}
.fit .big::after{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:var(--panel2)}
.fit .big span{position:relative;z-index:1}
.fit .big{position:relative}
.fit p{margin:0}
.fit small{color:var(--muted)}
.tsec{margin:18px 0 8px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.tsec small{color:var(--muted);font-weight:400}
.req{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.req:last-child{border:0}
.req .st{flex:none;width:58px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.req.met .st{color:var(--ok)}.req.partial .st{color:var(--warn)}.req.missing .st{color:var(--muted)}
.req small{display:block;color:var(--muted)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.opt input{margin-top:3px}
.opt .body{flex:1;min-width:0}
.opt .why{font-size:12.5px;color:var(--muted);margin-top:4px}
.opt textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel2);resize:vertical;min-height:52px;line-height:1.45;margin-top:6px}
.card.entry .caret{transition:transform .15s}
.card.entry.collapsed .caret{transform:rotate(-90deg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f input,.f textarea,.f select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--ink)}
.f input:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;background:var(--panel)}
.f textarea{resize:vertical;min-height:72px;line-height:1.5}
.f .hint{font-size:12px;color:var(--muted);margin-top:4px}
.f.chk{display:flex;align-items:center;gap:8px;align-self:end;padding:8px 0}
.f.chk input{width:auto}
.bullets{margin-top:12px}
.bullets .bh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bullets .bh label{flex:1;font-size:12px;color:var(--muted)}
.bullet{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.bullet .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);margin:12px 4px 0 2px;flex:none}
.bullet textarea{flex:1;min-height:38px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--ink);resize:none;line-height:1.45;overflow:hidden}
.bullet textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;background:var(--panel)}
.bullet .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:8px 4px;border-radius:6px}
.bullet .x:hover{color:var(--warn);background:var(--warn-soft)}
.bullet.weak textarea{border-color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}

/* ---- preview ---- */
.preview{overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--bg)}
.pv-tools{display:flex;gap:8px;align-items:center;width:100%;max-width:816px;justify-content:space-between;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.pv-tools>span:first-child{flex:1 1 auto;white-space:nowrap}
.paper-wrap{width:100%;max-width:816px}
.paper{background:var(--paper);color:var(--paper-ink);width:816px;min-height:1056px;padding:59px 59px;box-shadow:var(--shadow);transform-origin:top left;position:relative}
.paper *{box-sizing:border-box;-webkit-text-size-adjust:none;text-size-adjust:none}
.pagebreak{position:absolute;left:0;right:0;border-top:1px dashed #c8b98b;pointer-events:none}
.pagebreak::after{content:"page break (approx.)";position:absolute;right:8px;top:-9px;font:10px var(--ui);color:#a08a4a;background:var(--paper);padding:0 4px}

/* resume templates: shared */
.r{font-size:var(--rs,10.5pt);line-height:1.22;--sp:1}
.r .name{font-weight:700;letter-spacing:-.01em;margin:0}
.r .role{margin:1px 0 0;color:#444}
.r .contact{margin:5px 0 0;color:#333;display:flex;flex-wrap:wrap;gap:2px 0}
.r .contact span+span::before{content:"|";margin:0 7px;color:#999}
.r .contact a{color:inherit;text-decoration:none}
.r h3{margin:calc(11px * var(--sp)) 0 calc(4px * var(--sp));font-size:1.02em;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.r .item{margin-bottom:calc(6px * var(--sp))}
.r .line{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.r .line .l{font-weight:700}
.r .line .r2{color:#333;white-space:nowrap}
.r .sub{display:flex;justify-content:space-between;gap:10px;font-style:italic;color:#333}
.r ul{margin:2px 0 0;padding-left:14px}
.r li{margin:calc(1px * var(--sp)) 0;padding-left:1px}
.r p{margin:0}
.r .sk{margin:1px 0}
.r .sk b{font-weight:700}
.r .cert{display:flex;justify-content:space-between;gap:10px}
/* classic: serif, centered header, rule under headings */
.r.classic{font-family:"Spectral",Georgia,"Times New Roman",serif}
.r.classic .hdr{text-align:center;border-bottom:1.5px solid var(--racc);padding-bottom:8px}
.r.classic .name{font-size:2.15em}
.r.classic .contact{justify-content:center}
.r.classic h3{border-bottom:.75px solid #999;padding-bottom:2px;color:var(--racc)}
/* modern: sans, left header with accent block */
.r.modern{font-family:"Carlito",Calibri,"Segoe UI",Arial,sans-serif;font-size:calc(var(--rs,10.5pt) * 1.06)}
.r.modern .hdr{border-left:6px solid var(--racc);padding-left:12px}
.r.modern .name{font-size:2.3em;line-height:1.05;color:var(--racc)}
.r.modern h3{color:var(--racc);letter-spacing:.08em;font-size:.95em;margin-top:calc(13px * var(--sp))}
.r.modern h3::after{content:"";display:block;height:2px;background:var(--racc);width:28px;margin-top:3px}

/* ---- modal ---- */
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.overlay.open{display:flex}
.modal{background:var(--panel);width:100%;max-width:720px;max-height:min(88vh,88%);border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
@media (min-width:700px){.overlay{align-items:center;padding:20px}.modal{border-radius:14px}}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:16px;font-weight:600;flex:1}
.modal .mbody{padding:16px 18px;overflow:auto}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.status{display:flex;gap:10px;align-items:center;color:var(--muted);padding:16px 0}
.status .spin{color:var(--ai)}
.sugg{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.sugg input[type=checkbox]{margin-top:3px}
.sugg .ctx{font-size:12px;color:var(--muted);grid-column:2}
.sugg .old{color:var(--muted);text-decoration:line-through;grid-column:2}
.sugg .new{grid-column:2}
.sugg .why{grid-column:2;font-size:12.5px;color:var(--warn)}
.sugg textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel2);resize:vertical;min-height:52px;line-height:1.45}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;background:var(--panel2);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.present{background:transparent;color:var(--muted);cursor:default}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.checks li .btn{flex:none;margin-top:2px}
.checks li:last-child{border:0}
.checks .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;background:var(--warn-soft);color:var(--warn)}
.checks li.ok .ic{background:var(--accent-soft);color:var(--ok)}
.checks .t{flex:1}
.checks .t small{display:block;color:var(--muted)}
.diff{display:grid;gap:10px}
.diff .box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel2);white-space:pre-wrap;line-height:1.5}
.diff .box.new{background:var(--ai-soft);border-color:transparent}
.diff label{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
.toast.show{opacity:1}

/* ---- mobile / tablet ---- */
.tabs{display:none}
@media (max-width:1180px){
  .work{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rail{display:none}
  .editor{padding:16px 18px 90px}
  .secbar{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin:0 0 6px;scrollbar-width:none}
  .secbar::-webkit-scrollbar{display:none}
  .secbar .chip{white-space:nowrap}
}
@media (min-width:1181px){.secbar{display:none}}
@media (max-width:760px){
  .work{grid-template-columns:1fr}
  .work>.editor,.work>.preview{display:none}
  .work.show-edit>.editor,.work.show-pv>.preview{display:block}
  .work.show-pv>.preview{display:flex}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;gap:6px}
  .tabs button{flex:1;padding:9px;border:0;background:transparent;border-radius:8px;color:var(--muted)}
  .tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .topbar{padding:8px 12px;gap:8px}
  .brand .tag,.topbar .hide-m{display:none}
  .preview{padding:12px 12px 80px}
  .grid{grid-template-columns:1fr}
  .editor .head .acts{margin-left:0}
}
@media print{
  body{background:#fff}
  .topbar,.rail,.editor,.tabs,.pv-tools,.pagebreak,.toast,.overlay{display:none!important}
  .work{display:block}
  .preview{display:block!important;padding:0;overflow:visible}
  .paper{box-shadow:none;transform:none!important;width:auto;min-height:0;padding:0.55in 0.6in}
  @page{size:letter;margin:0}
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><span class="mark">Folio</span><span class="tag">resume studio</span></div>
    <button class="score" id="scoreBtn" title="Resume health"><span class="ring" id="ring"></span><b id="scoreNum">–</b><span class="hide-m">/100</span></button>
    <button class="btn ai" id="aiMenuBtn"><span>✦</span><span class="hide-m">AI tools</span></button>
    <div class="menu" id="dlMenu">
      <button class="btn primary" id="dlBtn">Download <span class="hide-m">▾</span></button>
      <div class="menu-list">
        <button data-act="pdf">PDF <small>text-based, ATS-safe</small></button>
        <button data-act="docx">Word document <small>.docx</small></button>
        <button data-act="print">Print…</button>
        <hr>
        <button data-act="versions">Versions… <small>save / switch</small></button>
        <button data-act="json">Back up data <small>.json</small></button>
        <button data-act="import">Restore from backup…</button>
        <button data-act="importText">Import from pasted resume… <small>AI</small></button>
        <hr>
        <button data-act="sample">Load sample resume</button>
        <button data-act="reset">Clear everything</button>
      </div>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>

  <div class="work show-edit" id="work">
    <aside class="rail" id="rail"></aside>
    <main class="editor" id="editor"></main>
    <section class="preview" id="preview">
      <div class="pv-tools">

/* PDF fonts live in ./fonts and are fetched on first export, then kept in memory. */
const FONT_FILES = ['Spectral-Regular','Spectral-Bold','Spectral-Italic','Spectral-BoldItalic','Carlito-Regular','Carlito-Bold','Carlito-Italic','Carlito-BoldItalic'];
let FONT_VFS = null;
async function loadFonts(family) {
  FONT_VFS = FONT_VFS || {};
  const need = FONT_FILES.filter(f => f.startsWith(family) && !FONT_VFS[f + '.ttf']);
  await Promise.all(need.map(async f => {
    const r = await fetch(`fonts/${f}.ttf`); if (!r.ok) throw new Error(`fonts/${f}.ttf ${r.status}`);
    const bytes = new Uint8Array(await r.arrayBuffer()); let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    FONT_VFS[f + '.ttf'] = btoa(s);
  }));
}

$('#editor').addEventListener('input', e => {
  const t = e.target;

function contactLine(c) {

}

const VERBS = /^(led|built|designed|shipped|launched|created|developed|reduced|increased|improved|drove|owned|managed|delivered|implemented|architected|migrated|automated|optimized|grew|cut|saved|negotiated|mentored|coached|founded|established|scaled|streamlined|spearheaded|coordinated|analy[sz]ed|engineered|introduced|partnered|presented|published|redesigned|resolved|secured|standardized|taught|tested|wrote|won|achieved|accelerated|consolidated|generated|integrated|modernized|orchestrated|overhauled|pioneered|produced|reengineered|refactored|restructured|transformed|deployed|maintained|operated|trained|supervised|directed|oversaw|planned|researched|authored|collaborated)\b/i;

  add('Experience', 1, !exp.length || perRole[0] >= 3, 'Most recent role has 3+ bullets', 'The top role gets the most attention; give it the most evidence.', 'experience');
  const years = exp.map(e => yearOf(e.current ? '' : e.end) || (e.current ? 9999 : yearOf(e.start)));

        ${v.length ? v.map(x=>`<div class="arr"><span class="n">${esc(x.name)}<br><small style="color:var(--muted)">${new Date(x.date).toLocaleString()} · ${esc(x.data.contact?.name||'')}</small></span>
          <button class="btn sm" data-vload="${x.id}">Load</button><button class="btn sm ghost danger" data-vdel="${x.id}" aria-label="Delete">✕</button></div>`).join('')
        : `<p style="color:var(--muted)">No saved versions yet. Save one before tailoring for a specific job, then load it back to start from your master again.</p>`}`;
      $('#vSave').onclick = () => { this.snapshot($('#vName').value.trim()); render(); toast('Version saved'); };
    };
    openModal('Versions', '', `<button class="btn" data-close>Done</button>`); render();
    $('#mBody').onclick = async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.vload) { const x = this.list().find(y=>y.id===b.dataset.vload); if (x && await ask('Load version', `Replace the current resume with “${esc(x.name)}”? The current content will be saved as a version first.`, 'Load', false)) { this.snapshot('Auto-save before loading'); S = Object.assign(blank(), x.data); S.settings = Object.assign(blank().settings, x.data.settings||{}); weakMarks = {}; commit(true); toast(`Loaded ${x.name}`); } }
      else if (b.dataset.vdel) { this.write(this.list().filter(y=>y.id!==b.dataset.vdel)); render(); }
    };
  },
};

/* =========================== arrange + confirm =========================== */
function arrangeModal() {
  const render = () => {
    $('#mBody').innerHTML = `<p style="margin:0 0 6px;color:var(--muted)">Order and visibility of sections on the resume. Contact always stays at the top.</p>` +
      S.settings.order.map((s,i)=>`<div class="arr ${S.settings.hidden[s]?'off':''}"><span class="n">${SECTIONS[s].label} <span style="color:var(--muted);font-size:12px">${sectionCount(s)||''}</span></span>
        <button class="btn sm icon" data-amv="-1" data-s="${s}" ${i===0?'disabled':''} aria-label="Move up">↑</button>
        <button class="btn sm icon" data-amv="1" data-s="${s}" ${i===S.settings.order.length-1?'disabled':''} aria-label="Move down">↓</button>
        <button class="btn sm" data-ahide="${s}">${S.settings.hidden[s]?'Show':'Hide'}</button></div>`).join('');
  };
  openModal('Arrange sections', '', `<button class="btn primary" data-close>Done</button>`); render();
  $('#mBody').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.amv) { const o = S.settings.order, i = o.indexOf(b.dataset.s), j = i + +b.dataset.amv; if (j>=0 && j<o.length) { [o[i],o[j]]=[o[j],o[i]]; } }
    if (b.dataset.ahide) S.settings.hidden[b.dataset.ahide] = !S.settings.hidden[b.dataset.ahide];
    commit(true); render();
  };
}
function ask(title, msg, okLabel='Confirm', danger=true) {
  return new Promise(res => {
    openModal(title, `<p style="margin:0">${msg}</p>`, `<button class="btn" data-close>Cancel</button><button class="btn ${danger?'danger':'primary'}" id="askOk">${okLabel}</button>`);
    const done = v => { $('#overlay').removeEventListener('click', onClose); res(v); };
    const onClose = e => { if (e.target === e.currentTarget || e.target.closest('[data-close]')) done(false); };
    $('#overlay').addEventListener('click', onClose);
    $('#askOk').onclick = () => { closeModal(); done(true); };
  });
}

/* =========================== modal =========================== */
function openModal(title, body, foot='') { $('#mTitle').textContent = title; $('#mBody').innerHTML = body; $('#mFoot').innerHTML = foot; $('#overlay').classList.add('open'); }
function closeModal() { $('#overlay').classList.remove('open'); AI.abort(); }
$('#mClose').onclick = closeModal;
$('#overlay').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('#dlMenu').classList.remove('open'); } });
</script>
<script>
/* =========================== AI (viewer's Claude via sample) =========================== */
const AI = {
  fn: null, available: false, ctl: null,
  abort() { this.ctl?.abort(); this.ctl = null; },
  copyFor(code) { return ({
    not_granted:'Claude access was declined for this page, so AI tools are hidden.',
    sampling_disabled:'Claude is not available on this account.',
    rate_limited:'Too many requests right now — give it a minute and try again.',
    session_expired:'Your session expired. Sign in again and retry.',
    refused:'Claude declined this request. Try rephrasing the content.',
    invalid_json:'The reply came back in an unexpected shape. Try again.',
    prompt_too_large:'Too much text for one request. Try a single section.',
    empty_completion:'Claude returned nothing. Try again with a bit more context.',
  })[code] || 'Something went wrong on the AI side. Try again in a moment.'; },
  hideIfFatal(code) { if (['not_granted','sampling_disabled','not_declared','capability_disabled'].includes(code)) { this.available = false; $('#aiMenuBtn').hidden = true; renderEditor(); } },
  context() {
    const c = S.contact;
    const lines = [`Candidate: ${c.name||'(unnamed)'}${c.title?`, targeting: ${c.title}`:''}`];
    if (S.summary.trim()) lines.push(`Summary: ${S.summary.trim()}`);
    S.experience.forEach(e => lines.push(`Experience — ${e.role} at ${e.company} (${dates(e)}):\n` + e.bullets.filter(b=>b.trim()).map(b=>`  - ${b}`).join('\n')));
    S.projects.forEach(e => lines.push(`Project — ${e.name}${e.tech?` [${e.tech}]`:''}:\n` + e.bullets.filter(b=>b.trim()).map(b=>`  - ${b}`).join('\n')));
    S.involvement.forEach(e => lines.push(`Involvement — ${e.role} at ${e.org}:\n` + e.bullets.filter(b=>b.trim()).map(b=>`  - ${b}`).join('\n')));
    S.education.forEach(e => lines.push(`Education — ${e.degree} ${e.field}, ${e.school} (${dates(e)})`));
    if (S.skills.length) lines.push('Skills: ' + S.skills.map(s=>`${s.category?s.category+': ':''}${s.items}`).join('; '));
    if (S.certifications.length) lines.push('Certifications: ' + S.certifications.map(s=>s.name).join(', '));
    return lines.join('\n');
  },
  RULES: `You are an expert resume writer and recruiter. Write in resume voice: no first-person pronouns, no filler, past tense for past roles and present tense for current ones. Each bullet should open with a strong action verb, state what was done and, wherever the original supplies or clearly implies a measure, the result. Never invent facts, numbers, tools or employers that are not in the source — if a metric is missing you may leave a bracketed placeholder like [X%] at most once per bullet. Keep bullets under 220 characters.`,
  async call(prompt, { json=false, tier, onText } = {}) {
    this.abort(); this.ctl = new AbortController();
    const opts = { signal: this.ctl.signal, modelTier: tier || S.settings.aiTier || 'default' };
    if (onText) opts.onText = onText;
    return json ? this.fn.json(prompt, opts) : (await this.fn(prompt, opts)).text;
  },
  status(msg) { return `<div class="status"><span class="spin"></span><span>${msg}</span></div>`; },
  fail(e) {
    if (e?.code === 'cancelled') return;
    $('#mBody').innerHTML = `<p style="color:var(--warn)">${this.copyFor(e?.code)}</p>`; $('#mFoot').innerHTML = `<button class="btn" data-close>Close</button>`;
    this.hideIfFatal(e?.code);
  },
  async run(kind, d) {
    if (!this.available) return;
    try {
      if (kind === 'summary' || kind === 'summary-generate') return await this.improveSummary(kind === 'summary-generate');
      if (kind === 'bullets') return await this.improveBullets(d.sec, d.id);
      if (kind === 'weak') return await this.weakBullets();
      if (kind === 'keywords' || kind === 'tailor') return this.tailorForm();
      if (kind === 'import') return this.importForm();
    } catch (e) { this.fail(e); }
  },

  /* --- summary --- */
  async improveSummary(generate) {
    const cur = S.summary.trim();
    if (!generate && !cur) { toast('Write a draft first, or use "Write from my experience".'); return; }
    openModal(generate ? 'Write a summary' : 'Improve summary', this.status('Thinking…'), `<button class="btn" data-close>Cancel</button>`);
    const prompt = `${this.RULES}\n\nHere is the candidate's resume content:\n${this.context()}\n\n${generate
      ? 'Write a professional summary of 2–3 sentences (35–60 words) for the top of this resume. Lead with the candidate\'s role and years of experience if inferable, then their strongest concrete achievements and the value they bring. Reply with only the summary text.'
      : `Rewrite this professional summary to be sharper, more specific and more compelling, 35–60 words, keeping every fact true to the source:\n"""${cur}"""\n\nReply with only the rewritten summary text.`}`;
    let text = '';
    const render = () => { $('#mBody').innerHTML = `<div class="diff">${cur?`<div><label>Current</label><div class="box">${esc(cur)}</div></div>`:''}<div><label>Suggested</label><div class="box new" id="aiOut">${esc(text)||'…'}</div></div></div>`; };
    text = (await this.call(prompt, { onText: ({text:t}) => { text = t; const o = $('#aiOut'); if (o) o.textContent = t; else render(); } })).trim().replace(/^"|"$/g,'');
    render();
    $('#mFoot').innerHTML = `<button class="btn" data-close>Discard</button><button class="btn primary" id="applySum">Use this summary</button>`;
    $('#applySum').onclick = () => { S.summary = text; commit(true); closeModal(); toast('Summary updated'); };
  },

  /* --- bullets for one entry --- */
  async improveBullets(sec, id) {
    const e = S[sec].find(x => x.id === id);
    const bl = e.bullets.map((b,i)=>({b:b.trim(),i})).filter(x=>x.b);
    if (!bl.length) { toast('Add a bullet or two first.'); return; }
    const head = sec==='experience' ? `${e.role} at ${e.company}` : sec==='projects' ? `project ${e.name}` : sec==='involvement' ? `${e.role} at ${e.org}` : `${e.school}`;
    openModal('Improve bullets', this.status('Rewriting bullets…'), `<button class="btn" data-close>Cancel</button>`);
    const prompt = `${this.RULES}\n\nContext for the whole resume:\n${this.context()}\n\nRewrite each of these bullets for the entry "${head}". Keep the same order and the same number of items. Make each one stronger: sharper verb, clearer scope, concrete outcome. If a bullet is already excellent, return it unchanged.\n\n${bl.map((x,k)=>`${k+1}. ${x.b}`).join('\n')}\n\nReply with only a JSON array of strings, one per bullet, in order. Example: ["Led …", "Cut …"]`;
    const out = await this.call(prompt, { json:true });
    if (!Array.isArray(out)) throw { code:'invalid_json' };
    this.reviewList('Improve bullets', bl.map((x,k)=>({ sec, id, i:x.i, ctx: head, old:x.b, neu: String(out[k] ?? x.b) })));
  },

  /* --- weak bullets across the resume --- */
  async weakBullets() {
    const bl = allBullets();
    if (!bl.length) { toast('No bullets to review yet.'); return; }
    openModal('Find weak bullets', this.status('Reading every bullet…'), `<button class="btn" data-close>Cancel</button>`);
    const numbered = bl.map((x,k)=>`${k+1}. [${x.sec} — ${x.e.role||x.e.name||x.e.school||''}] ${x.text}`).join('\n');
    const prompt = `${this.RULES}\n\nReview these resume bullets. Identify the weak ones: vague ("worked on", "helped with", "responsible for"), missing an outcome or metric, passive, duplicated, too long, or buried leading with a tool instead of a result. Skip bullets that are already strong.\n\n${numbered}\n\nReply with only a JSON array of objects {"n": <bullet number>, "issue": "<one short sentence naming the problem>", "rewrite": "<improved bullet>"}, weakest first, at most 10 items. Return [] if all are strong.`;
    const out = await this.call(prompt, { json:true });
    if (!Array.isArray(out)) throw { code:'invalid_json' };
    weakMarks = {};
    const items = out.filter(o => bl[o.n-1]).map(o => { const x = bl[o.n-1]; weakMarks[`${x.sec}:${x.e.id}:${x.i}`] = o.issue; return { sec:x.sec, id:x.e.id, i:x.i, ctx:`${SECTIONS[x.sec].label}: ${x.e.role||x.e.name||x.e.school||''}`, old:x.text, neu:String(o.rewrite||''), why:o.issue }; });
    renderEditor();
    if (!items.length) { $('#mBody').innerHTML = `<p>Every bullet reads as strong — nice work. The local health check (score in the top bar) covers structure and completeness.</p>`; $('#mFoot').innerHTML = `<button class="btn" data-close>Close</button>`; return; }
    this.reviewList('Weak bullets', items, `${items.length} bullet${items.length>1?'s':''} could be stronger. Weak ones are outlined in orange in the editor until you edit them.`);
  },

  /* --- keywords from a job description --- */
  keywordsForm() {
    openModal('Match a job posting', `<p style="margin:0 0 8px;color:var(--muted)">Paste the job description. Claude will pull the skills and keywords it expects, show which ones you already have, and suggest bullet tweaks to work the missing ones in — without inventing experience.</p>
      <div class="f"><textarea id="jd" style="min-height:180px" placeholder="Paste the job description here…"></textarea></div>`,
      `<button class="btn" data-close>Cancel</button><button class="btn ai" id="kwGo">✦ Analyze</button>`);
    $('#kwGo').onclick = () => this.keywords($('#jd').value.trim());
    $('#jd').focus();
  },
  async keywords(jd) {
    if (jd.length < 80) { toast('Paste a fuller job description (a few paragraphs).'); return; }
    $('#mBody').innerHTML = this.status('Comparing the posting against your resume…'); $('#mFoot').innerHTML = `<button class="btn" data-close>Cancel</button>`;
    const prompt = `${this.RULES}\n\nJOB DESCRIPTION:\n"""${jd.slice(0, 12000)}"""\n\nCANDIDATE RESUME:\n${this.context()}\n\nTasks:\n1. Extract the 12–20 most important hard skills, tools, and domain keywords the posting expects (the exact phrasing an ATS would match on).\n2. Mark each as "present" if the resume already contains it or a clear synonym, otherwise "missing".\n3. For missing keywords the candidate plausibly HAS (based on adjacent skills or duties), suggest up to 5 rewrites of EXISTING bullets that honestly work the keyword in. Quote the exact original bullet text. Never fabricate experience; if the keyword is clearly outside the candidate's background, do not suggest it.\n4. Suggest a short list of missing keywords that are reasonable to add to the Skills section as-is.\n\nReply with only JSON: {"keywords":[{"k":"…","status":"present|missing"}], "rewrites":[{"original":"<exact bullet>","rewrite":"…","keyword":"…"}], "addToSkills":["…"], "title":"<the job title from the posting>"}`;
    let out;
    try { out = await this.call(prompt, { json:true }); } catch (e) { this.fail(e); return; }
    const kws = Array.isArray(out?.keywords) ? out.keywords : [];
    const bl = allBullets();
    const rewrites = (out?.rewrites||[]).map(r => { const m = bl.find(x => x.text === r.original) || bl.find(x => x.text.includes((r.original||'').slice(0,40))); return m ? { sec:m.sec, id:m.e.id, i:m.i, ctx:`Adds “${r.keyword}” · ${m.e.role||m.e.name||''}`, old:m.text, neu:String(r.rewrite||'') } : null; }).filter(Boolean);
    const add = (out?.addToSkills||[]).filter(k => !S.skills.some(s => s.items.toLowerCase().includes(String(k).toLowerCase())));
    const present = kws.filter(k=>k.status==='present').length;
    $('#mTitle').textContent = `Match: ${out?.title || 'job posting'}`;
    $('#mBody').innerHTML = `<p style="margin:0 0 10px"><b>${present} of ${kws.length}</b> keywords already appear on your resume.</p>
      <div class="chips" style="margin-bottom:16px">${kws.map(k=>`<span class="chip ${k.status==='present'?'present':''}">${k.status==='present'?'✓ ':''}${esc(k.k)}</span>`).join('')}</div>
      ${add.length ? `<h4 style="margin:0 0 6px;font-weight:600">Add to Skills</h4><p style="margin:0 0 6px;color:var(--muted);font-size:12.5px">Tap to select the ones you genuinely have.</p><div class="chips" id="addKw" style="margin-bottom:16px">${add.map(k=>`<button class="chip on" data-k="${esc(k)}">${esc(k)}</button>`).join('')}</div>` : ''}
      ${rewrites.length ? `<h4 style="margin:0 0 6px;font-weight:600">Bullet rewrites</h4>` + this.suggHTML(rewrites) : `<p style="color:var(--muted)">No safe bullet rewrites — the missing keywords are outside what your bullets describe.</p>`}`;
    $('#addKw')?.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) b.classList.toggle('on'); });
    $('#mFoot').innerHTML = `<button class="btn" data-close>Close</button><button class="btn primary" id="kwApply">Apply selected</button>`;
    $('#kwApply').onclick = () => {
      const picks = $$('#addKw .chip.on').map(b => b.dataset.k);
      if (picks.length) { let tgt = S.skills.find(s => /other|tools|keywords|additional/i.test(s.category)) ; if (!tgt) { tgt = newEntry.skills(); tgt.category = 'Additional'; S.skills.push(tgt); } tgt.items = [tgt.items, ...picks].filter(Boolean).join(', '); }
      const n = this.applySugg(rewrites);
      commit(true); closeModal(); toast(`Added ${picks.length} skill${picks.length===1?'':'s'}, updated ${n} bullet${n===1?'':'s'}`);
    };
  },

  /* --- tailor to a job posting --- */
  tailorForm() {
    openModal('Tailor to a job posting', `<p style="margin:0 0 8px;color:var(--muted)">Paste the full job description. Claude compares it against your resume and proposes changes; you approve each one. Your current version is saved automatically before anything is applied.</p>
      <div class="f"><textarea id="jd" style="min-height:200px" placeholder="Paste the job description here…">${esc(S.lastJD||'')}</textarea></div>
      <div class="f" style="margin-top:10px"><label for="jdNotes">Anything to emphasize or avoid? (optional)</label><input id="jdNotes" placeholder="e.g. lean on the healthcare work; I don't want to lead with management"></div>`,
      `<button class="btn" data-close>Cancel</button><button class="btn ai" id="tGo">✦ Analyze</button>`);
    $('#tGo').onclick = () => this.tailor($('#jd').value.trim(), $('#jdNotes').value.trim());
    $('#jd').focus();
  },
  async tailor(jd, notes) {
    if (jd.length < 80) { toast('Paste a fuller job description (a few paragraphs).'); return; }
    S.lastJD = jd; save();
    $('#mBody').innerHTML = this.status('Reading the posting and comparing it with your resume…'); $('#mFoot').innerHTML = `<button class="btn" data-close>Cancel</button>`;
    const sections = S.settings.order.map(s => `${s} (${vis(s).length || (s==='summary' ? (S.summary?1:0) : 0)} items)`).join(', ');
    const entries = ['experience','projects','involvement'].flatMap(sec => S[sec].map(e => `${sec}:${e.id} = ${e.role||e.name||''}${e.company||e.org?` @ ${e.company||e.org}`:''}${e.off?' [currently hidden]':''}`)).join('\n');
    const prompt = `${this.RULES}\n\nYou are tailoring a candidate's resume to one specific job posting. Be honest: the goal is to present real experience in the language and priority order this employer uses, never to claim things the candidate has not done.\n\nJOB DESCRIPTION:\n"""${jd.slice(0, 14000)}"""\n${notes?`\nCANDIDATE'S NOTES: ${notes}\n`:''}\nCANDIDATE RESUME:\n${this.context()}\n\nCurrent section order: ${sections}\nEntry ids you may reference:\n${entries}\n\nProduce:\n1. title/company from the posting.\n2. fitScore 0–100: how well the resume as written matches, and a two-sentence fitSummary (strengths first, then the main gap).\n3. requirements: the 6–12 most important requirements from the posting, each with status "met", "partial" or "missing" and one line of evidence from the resume (or what is absent).\n4. headline: a target-role headline for the top of the resume matching the posting's title wording (only if it is truthful).\n5. summary: a rewritten 35–60 word professional summary aimed at this role, built only from facts in the resume.\n6. keywords: 12–20 ATS keywords/skills the posting expects, each "present" or "missing".\n7. addToSkills: missing keywords the candidate plausibly has given adjacent skills (be conservative).\n8. rewrites: up to 8 rewrites of EXISTING bullets that make relevance to this posting explicit or work a keyword in honestly. Quote the exact original text. Prefer bullets in the most relevant roles.\n9. emphasis: for entries listed above, actions {"id":"<sec:id>","action":"move_up"|"hide"|"show","why":"…"} — move the most relevant roles/projects up within their section, hide clearly irrelevant projects or involvement if the resume is long, un-hide hidden ones that are relevant. Keep it to at most 5 actions; empty array if the current order is fine.\n10. sectionOrder: the best order of these section keys for this posting: ${S.settings.order.join(', ')} (all of them, reordered), plus one sentence "orderWhy".\n\nReply with only JSON: {"title":"","company":"","fitScore":0,"fitSummary":"","requirements":[{"req":"","status":"met","evidence":""}],"headline":"","summary":"","keywords":[{"k":"","status":"present"}],"addToSkills":[""],"rewrites":[{"original":"","rewrite":"","why":""}],"emphasis":[{"id":"","action":"move_up","why":""}],"sectionOrder":[""],"orderWhy":""}`;
    let out;
    try { out = await this.call(prompt, { json:true, tier: S.settings.aiTier === 'quick' ? 'default' : S.settings.aiTier }); } catch (e) { this.fail(e); return; }
    if (!out || typeof out !== 'object') { this.fail({ code:'invalid_json' }); return; }
    const bl = allBullets();
    const rewrites = (out.rewrites||[]).map(r => { const m = bl.find(x => x.text === r.original) || bl.find(x => x.text.includes(String(r.original||'').slice(0,40))); return m ? { sec:m.sec, id:m.e.id, i:m.i, ctx:`${m.e.role||m.e.name||''}`, old:m.text, neu:String(r.rewrite||''), why:r.why } : null; }).filter(Boolean);
    const kws = Array.isArray(out.keywords) ? out.keywords : [];
    const present = kws.filter(k=>k.status==='present').length;
    const add = (out.addToSkills||[]).map(String).filter(k => k && !S.skills.some(s => s.items.toLowerCase().includes(k.toLowerCase())));
    const emph = (out.emphasis||[]).map(a => { const [sec,id] = String(a.id||'').split(':'); const e = S[sec]?.find(x=>x.id===id); return e ? { sec, id, e, action:a.action, why:a.why, label:`${a.action==='move_up'?'Move up':a.action==='hide'?'Hide':'Show'}: ${e.role||e.name||''}${e.company||e.org?` @ ${e.company||e.org}`:''}` } : null; }).filter(Boolean);
    const newOrder = Array.isArray(out.sectionOrder) && out.sectionOrder.length === S.settings.order.length && out.sectionOrder.every(s => S.settings.order.includes(s)) ? out.sectionOrder : null;
    const orderChanged = newOrder && newOrder.join() !== S.settings.order.join();
    const score = Math.max(0, Math.min(100, +out.fitScore || 0));
    const col = score>=75?'var(--ok)':score>=50?'var(--accent)':'var(--warn)';
    const opt = (id, title, body, why, checked=true) => `<label class="opt"><input type="checkbox" data-opt="${id}" ${checked?'checked':''}><div class="body"><div>${title}</div>${body||''}${why?`<div class="why">${esc(why)}</div>`:''}</div></label>`;
    $('#mTitle').textContent = `Tailor: ${esc(out.title||'this role')}${out.company?` · ${esc(out.company)}`:''}`;
    $('#mBody').innerHTML = `
      <div class="fit"><div class="big" style="background:conic-gradient(${col} ${score}%, var(--line) 0)"><span>${score}</span></div><div><p><b>Fit as written</b></p><p><small>${esc(out.fitSummary||'')}</small></p></div></div>
      <div class="tsec">Requirements <small>${(out.requirements||[]).filter(r=>r.status==='met').length} met · ${(out.requirements||[]).filter(r=>r.status==='partial').length} partial · ${(out.requirements||[]).filter(r=>r.status==='missing').length} missing</small></div>
      ${(out.requirements||[]).map(r=>`<div class="req ${esc(r.status)}"><span class="st">${esc(r.status)}</span><span>${esc(r.req)}<small>${esc(r.evidence||'')}</small></span></div>`).join('')}
      <div class="tsec">Keywords <small>${present} of ${kws.length} already present</small></div>
      <div class="chips">${kws.map(k=>`<span class="chip ${k.status==='present'?'present':''}">${k.status==='present'?'✓ ':''}${esc(k.k)}</span>`).join('')}</div>
      <div class="tsec">Proposed changes <small>tick what to apply</small></div>
      ${out.headline && out.headline !== S.contact.title ? opt('headline', `<b>Headline:</b> ${esc(out.headline)}`, S.contact.title?`<div class="why">Currently: ${esc(S.contact.title)}</div>`:'', '') : ''}
      ${out.summary ? opt('summary', `<b>Tailored summary</b>`, `<textarea id="tSummary">${esc(out.summary)}</textarea>`, '') : ''}
      ${add.length ? opt('skills', `<b>Add to Skills:</b> ${add.map(esc).join(', ')}`, '', 'Only tick this if you genuinely have these; you can edit the Skills section afterwards.') : ''}
      ${orderChanged ? opt('order', `<b>Section order:</b> ${newOrder.map(s=>SECTIONS[s].label).join(' → ')}`, '', out.orderWhy) : ''}
      ${emph.map((a,k)=>opt(`emph${k}`, `<b>${esc(a.label)}</b>`, '', a.why)).join('')}
      ${rewrites.length ? `<div class="tsec">Bullet rewrites <small>${rewrites.length}</small></div>` + this.suggHTML(rewrites) : ''}`;
    $$('.sugg textarea, #tSummary').forEach(autoGrow);
    $('#mFoot').innerHTML = `<button class="btn" data-close>Close</button><button class="btn primary" id="tApply">Apply selected</button>`;
    $('#tApply').onclick = () => {
      const on = id => $(`[data-opt="${id}"]`)?.checked;
      Versions.snapshot(`Before tailoring for ${out.title||'job'}`);
      let n = 0;
      if (on('headline')) { S.contact.title = out.headline; n++; }
      if (on('summary')) { S.summary = $('#tSummary').value.trim(); n++; }
      if (on('skills') && add.length) { let tgt = S.skills.find(s => /other|tools|keywords|additional/i.test(s.category)); if (!tgt) { tgt = newEntry.skills(); tgt.category = 'Additional'; S.skills.push(tgt); } tgt.items = [tgt.items, ...add].filter(Boolean).join(', '); n++; }
      if (on('order') && newOrder) { S.settings.order = newOrder; n++; }
      emph.forEach((a,k) => { if (!on(`emph${k}`)) return; const arr = S[a.sec]; const i = arr.indexOf(a.e); if (a.action==='hide') a.e.off = true; else if (a.action==='show') a.e.off = false; else if (a.action==='move_up' && i > 0) { arr.splice(i,1); arr.splice(0,0,a.e); } n++; });
      n += this.applySugg(rewrites);
      commit(true); closeModal(); toast(`Applied ${n} change${n===1?'':'s'} — the previous version is saved under Download → Versions.`);
    };
  },

  /* --- import from pasted resume text --- */
  importForm() {
    openModal('Import a resume', `<p style="margin:0 0 8px;color:var(--muted)">Paste the full text of an existing resume. Claude will sort it into Folio's sections; you'll see what it found before anything changes.</p>
      <div class="f"><textarea id="impText" style="min-height:220px" placeholder="Select all → copy in your PDF or old builder, then paste here…"></textarea></div>`,
      `<button class="btn" data-close>Cancel</button><button class="btn ai" id="impGo">✦ Read it</button>`);
    $('#impGo').onclick = () => this.importText($('#impText').value.trim());
    $('#impText').focus();
  },
  async importText(text) {
    if (text.length < 100) { toast('That looks too short to be a resume.'); return; }
    $('#mBody').innerHTML = this.status('Reading and sorting the resume…'); $('#mFoot').innerHTML = `<button class="btn" data-close>Cancel</button>`;
    const prompt = `You are converting the plain text of a resume into structured JSON. Copy the wording exactly as written — do not improve, shorten or invent anything. Split text that ran together on copy where the structure is obvious. Dates stay as written (e.g. "Jun 2022", "2019 – Present"); if a role is described as current, set "current": true and leave "end" empty. Skills: group them by the categories the resume uses; if it has none, put them all under one entry with an empty category. Bullets are separate strings. Leave fields you cannot find as empty strings or empty arrays.

RESUME TEXT:
"""${text.slice(0, 20000)}"""

Reply with only JSON in exactly this shape:
{"contact":{"name":"","title":"","email":"","phone":"","location":"","website":"","linkedin":"","github":""},
 "summary":"",
 "experience":[{"role":"","company":"","location":"","start":"","end":"","current":false,"bullets":[""]}],
 "education":[{"school":"","degree":"","field":"","location":"","start":"","end":"","gpa":"","bullets":[""]}],
 "projects":[{"name":"","link":"","tech":"","start":"","end":"","bullets":[""]}],
 "skills":[{"category":"","items":"comma, separated"}],
 "certifications":[{"name":"","issuer":"","date":"","link":""}],
 "involvement":[{"role":"","org":"","location":"","start":"","end":"","bullets":[""]}]}`;
    let out;
    try { out = await this.call(prompt, { json:true }); } catch (e) { this.fail(e); return; }
    if (!out || typeof out !== 'object' || !out.contact) { this.fail({ code:'invalid_json' }); return; }
    const arr = k => Array.isArray(out[k]) ? out[k] : [];
    const clean = (sec, e) => { const n = Object.assign(newEntry[sec](), e); n.id = uid(); if (Array.isArray(n.bullets)) n.bullets = n.bullets.map(b=>String(b||'').trim()).filter(Boolean); else if ('bullets' in newEntry[sec]()) n.bullets = []; Object.keys(n).forEach(k => { if (typeof n[k] === 'string') n[k] = n[k].trim(); }); return n; };
    const parsed = {
      contact: Object.assign(blank().contact, Object.fromEntries(Object.entries(out.contact||{}).map(([k,v])=>[k,String(v||'').trim()]))),
      summary: String(out.summary||'').trim(),
      experience: arr('experience').map(e=>clean('experience',e)), education: arr('education').map(e=>clean('education',e)),
      projects: arr('projects').map(e=>clean('projects',e)), skills: arr('skills').filter(s=>s.items).map(e=>clean('skills',e)),
      certifications: arr('certifications').filter(c=>c.name).map(e=>clean('certifications',e)), involvement: arr('involvement').map(e=>clean('involvement',e)),
    };
    const rows = [['Name', parsed.contact.name || '—'], ['Summary', parsed.summary ? `${parsed.summary.split(/\s+/).length} words` : 'none'],
      ...['experience','education','projects','skills','certifications','involvement'].map(k => [SECTIONS[k].label, `${parsed[k].length} ${parsed[k].length===1?'entry':'entries'}${parsed[k][0]?.bullets ? `, ${parsed[k].reduce((n,e)=>n+(e.bullets?.length||0),0)} bullets` : ''}`])];
    const hasContent = !!(S.contact.name || S.experience.length || S.summary);
    $('#mBody').innerHTML = `<p style="margin:0 0 10px">Here's what Claude found. Anything it missed you can add by hand afterwards.</p>
      <ul class="checks">${rows.map(([a,b])=>`<li class="ok"><span class="ic">✓</span><span class="t">${a}<small>${esc(b)}</small></span></li>`).join('')}</ul>
      ${hasContent ? `<p style="color:var(--warn);font-size:12.5px;margin:12px 0 0">You already have content in Folio. "Replace" overwrites it (your style settings stay); "Merge" adds the imported entries after your existing ones.</p>` : ''}`;
    $('#mFoot').innerHTML = `<button class="btn" data-close>Cancel</button>${hasContent?`<button class="btn" id="impMerge">Merge</button>`:''}<button class="btn primary" id="impReplace">${hasContent?'Replace':'Import'}</button>`;
    const apply = merge => {
      if (!merge) { S.contact = parsed.contact; S.summary = parsed.summary; ['experience','education','projects','skills','certifications','involvement'].forEach(k => S[k] = parsed[k]); }
      else { Object.entries(parsed.contact).forEach(([k,v]) => { if (v && !S.contact[k]) S.contact[k] = v; }); if (!S.summary && parsed.summary) S.summary = parsed.summary; ['experience','education','projects','skills','certifications','involvement'].forEach(k => S[k].push(...parsed[k])); }
      weakMarks = {}; active = 'experience'; commit(true); closeModal(); toast('Resume imported — check each section for anything that landed in the wrong place.');
    };
    $('#impReplace').onclick = () => apply(false);
    $('#impMerge')?.addEventListener('click', () => apply(true));
  },

  /* --- shared review UI --- */
  suggHTML(items) {
    return items.map((s,k)=>`<div class="sugg"><input type="checkbox" checked data-k="${k}"><div class="ctx">${esc(s.ctx)}</div><div class="old">${esc(s.old)}</div>${s.why?`<div class="why">${esc(s.why)}</div>`:''}<div class="new"><textarea data-k="${k}">${esc(s.neu)}</textarea></div></div>`).join('');
  },
  applySugg(items) {
    let n = 0;
    $$('.sugg').forEach(el => { const k = +$('input',el).dataset.k; if (!$('input',el).checked) return; const s = items[k]; const val = $('textarea',el).value.trim(); if (!val || val === s.old) return; const e = S[s.sec].find(x=>x.id===s.id); if (e) { e.bullets[s.i] = val; delete weakMarks[`${s.sec}:${s.id}:${s.i}`]; n++; } });
    return n;
  },
  reviewList(title, items, note) {
    $('#mTitle').textContent = title;
    $('#mBody').innerHTML = `${note?`<p style="margin:0 0 12px;color:var(--muted)">${note}</p>`:''}<p style="margin:0 0 10px;font-size:12.5px;color:var(--muted)">Untick anything you don't want; you can edit the suggestions before applying.</p>${this.suggHTML(items)}`;
    $('#mFoot').innerHTML = `<button class="btn" data-close>Discard</button><button class="btn primary" id="applyAll">Apply selected</button>`;
    $$('.sugg textarea').forEach(autoGrow);
    $('#applyAll').onclick = () => { const n = this.applySugg(items); commit(true); closeModal(); toast(`Updated ${n} bullet${n===1?'':'s'}`); };
  },
};

/* =========================== exports =========================== */
let DL = null;
async function deliver(filename, data) {
  if (DL) { try { await DL.save({ filename, data }); toast(`Saved ${filename}`); return; } catch (e) { if (e?.code === 'declined') return; if (!['unavailable','not_granted','capability_disabled'].includes(e?.code)) { toast('Could not save the file. Try Print instead.'); return; } } }
  // fallback: plain anchor download (works when opened outside the viewer)
  try { const blob = data instanceof Blob ? data : new Blob([data]); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); } catch (e) { toast('Downloads are not available here — use Print › Save as PDF.'); }
}
const fileBase = () => (S.contact.name || 'resume').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_') + '_Resume';

/* --- PDF via pdfmake (real text, selectable, ATS-parseable) --- */
function pdfDef() {
  const st = S.settings, c = S.contact, acc = st.accent;
  const modern = st.template === 'modern';
  const font = modern ? 'Carlito' : 'Spectral';
  const fs = parseFloat(st.size) * (modern ? 1.06 : 1);
  const sp = spacing();
  const grey = '#333333';
  const content = [];
  const contactParts = [c.email, c.phone, c.location, c.website, c.linkedin, c.github].filter(Boolean).map(s => s.replace(/^https?:\/\//,''));
  const contactText = contactParts.flatMap((p,i) => i ? [{ text:'  |  ', color:'#999999' }, p] : [p]);
  // header
  if (modern) {
    content.push({ table:{ widths:[4,'*'], body:[[ { text:'', fillColor:acc }, { stack:[ { text:c.name||' ', fontSize:fs*2.3, bold:true, color:acc, lineHeight:1 }, c.title?{ text:c.title, color:grey, margin:[0,2,0,0] }:null, { text:contactText, color:grey, fontSize:fs*.95, margin:[0,4,0,0] } ].filter(Boolean), margin:[8,0,0,0] } ]] }, layout:'noBorders', margin:[0,0,0,4] });
  } else {
    content.push({ text:c.name||' ', fontSize:fs*2.15, bold:true, alignment:'center' });
    if (c.title) content.push({ text:c.title, alignment:'center', color:grey, margin:[0,1,0,0] });
    content.push({ text:contactText, alignment:'center', color:grey, fontSize:fs*.95, margin:[0,4,0,6] });
    content.push({ canvas:[{ type:'line', x1:0, y1:0, x2:524, y2:0, lineWidth:1.2, lineColor:acc }], margin:[0,0,0,2] });
  }
  const H = t => modern
    ? { stack:[ { text:t.toUpperCase(), bold:true, color:acc, fontSize:fs*.95, characterSpacing:1, margin:[0,10*sp,0,1] }, { canvas:[{ type:'line', x1:0, y1:0, x2:22, y2:0, lineWidth:1.6, lineColor:acc }], margin:[0,0,0,5*sp] } ] }
    : { stack:[ { text:t.toUpperCase(), bold:true, color:acc, fontSize:fs*1.02, characterSpacing:.8, margin:[0,9*sp,0,1] }, { canvas:[{ type:'line', x1:0, y1:0, x2:524, y2:0, lineWidth:.6, lineColor:'#999999' }], margin:[0,0,0,4*sp] } ] };
  const line = (l, r) => ({ columns:[ { text:l, bold:true }, { text:r, alignment:'right', width:'auto', color:grey } ], columnGap:8 });
  const sub = (l, r) => ({ columns:[ { text:l, italics:true, color:grey }, { text:r, alignment:'right', width:'auto', italics:true, color:grey } ], columnGap:8 });
  const ul = e => hasBullets(e) ? { ul: e.bullets.filter(b=>b.trim()), margin:[2,1,0,0] } : null;
  const item = arr => ({ stack: arr.filter(Boolean), margin:[0,0,0,6*sp] });
  for (const sec of st.order) {
    if (st.hidden[sec]) continue;
    if (sec === 'summary') { if (S.summary.trim()) { content.push(H('Summary'), { text:S.summary.trim() }); } continue; }
    const items = vis(sec); if (!items.length) continue;
    content.push(H(SECTIONS[sec].label));
    items.forEach(e => {
      if (sec === 'experience') content.push(item([ line(e.role, dates(e)), sub(e.company, e.location), ul(e) ]));
      else if (sec === 'education') content.push(item([ line(e.school, dates(e)), sub([[e.degree,e.field].filter(Boolean).join(' in '), e.gpa?`GPA ${e.gpa}`:''].filter(Boolean).join(', '), e.location), ul(e) ]));
      else if (sec === 'projects') content.push(item([ { columns:[ { text:[ { text:e.name, bold:true }, e.tech?{ text:`  |  ${e.tech}`, color:grey }:'' ] }, { text:dates(e), alignment:'right', width:'auto', color:grey } ], columnGap:8 }, e.link?{ text:e.link.replace(/^https?:\/\//,''), italics:true, color:grey }:null, ul(e) ]));
      else if (sec === 'skills') content.push({ text:[ e.category?{ text:`${e.category}: `, bold:true }:'', e.items ], margin:[0,0,0,1] });
      else if (sec === 'certifications') content.push({ columns:[ { text:[ { text:e.name, bold:true }, e.issuer?`, ${e.issuer}`:'' ] }, { text:e.date, alignment:'right', width:'auto', color:grey } ], columnGap:8, margin:[0,0,0,2] });
      else if (sec === 'involvement') content.push(item([ line(e.role, dates(e)), sub(e.org, e.location), ul(e) ]));
    });
  }
  return { pageSize:'LETTER', pageMargins:[44,40,44,40], content, defaultStyle:{ font, fontSize:fs, lineHeight: (sp < 1 ? 1.14 : 1.22) / (modern ? 1.2207 : 1.522), color:'#1b1b1b' }, info:{ title:`${c.name} — Resume`, author:c.name } };
}
async function exportPDF() {
  if (!window.pdfMake) { toast('PDF library did not load. Use Print › Save as PDF.'); return; }
  toast('Building PDF…');
  try { await loadFonts(S.settings.template === 'modern' ? 'Carlito' : 'Spectral'); } catch (e) { console.error(e); toast('Could not load the PDF fonts (fonts/ folder missing?). Use Print › Save as PDF.'); return; }
  const fonts = { Spectral:{ normal:'Spectral-Regular.ttf', bold:'Spectral-Bold.ttf', italics:'Spectral-Italic.ttf', bolditalics:'Spectral-BoldItalic.ttf' }, Carlito:{ normal:'Carlito-Regular.ttf', bold:'Carlito-Bold.ttf', italics:'Carlito-Italic.ttf', bolditalics:'Carlito-BoldItalic.ttf' } };
  const blob = await new Promise(res => pdfMake.createPdf(pdfDef(), null, fonts, FONT_VFS).getBlob(res));
  await deliver(fileBase() + '.pdf', blob);
}

/* --- DOCX via docx.js --- */
async function exportDOCX() {
  if (!window.docx) { toast('Word library did not load. Try again in a moment.'); return; }
  const { Document, Packer, Paragraph, TextRun, AlignmentType, TabStopType, BorderStyle, LevelFormat } = docx;
  const st = S.settings, c = S.contact, acc = st.accent.replace('#','');
  const modern = st.template === 'modern';
  const font = modern ? 'Calibri' : 'Georgia';
  const pt = parseFloat(st.size) * (modern ? 1.06 : 1);
  const sz = Math.round(pt * 2); // half-points
  const RIGHT = 10620; // 7.375in content width in twips (8.5 - 1.125 margins)
  const P = (runs, o={}) => new Paragraph({ children: runs.map(r => typeof r === 'string' ? new TextRun({ text:r, font, size:sz }) : new TextRun(Object.assign({ font, size:sz }, r))), spacing:{ after:o.after ?? 0, before:o.before ?? 0, line: 264 }, alignment:o.align, tabStops: o.tabs ? [{ type:TabStopType.RIGHT, position:RIGHT }] : undefined, border:o.border, numbering:o.num });
  const H = t => P([{ text:t.toUpperCase(), bold:true, color:acc, size:Math.round(sz*(modern?.95:1.02)), characterSpacing:20 }], { before:200, after:60, border: modern ? undefined : { bottom:{ style:BorderStyle.SINGLE, size:6, color:'999999', space:1 } } });
  const line = (l, r) => P([{ text:l, bold:true }, { text:`\t${r}`, color:'333333' }], { tabs:true });
  const sub = (l, r) => P([{ text:l, italics:true, color:'333333' }, { text:`\t${r||''}`, italics:true, color:'333333' }], { tabs:true });
  const bullets = e => (e.bullets||[]).filter(b=>b.trim()).map(b => P([b], { num:{ reference:'b', level:0 }, after:20 }));
  const kids = [];
  const contactStr = [c.email, c.phone, c.location, c.website, c.linkedin, c.github].filter(Boolean).map(s=>s.replace(/^https?:\/\//,'')).join('   |   ');
  kids.push(P([{ text:c.name||' ', bold:true, size:Math.round(sz*2.2), color: modern ? acc : undefined }], { align: modern ? AlignmentType.LEFT : AlignmentType.CENTER }));
  if (c.title) kids.push(P([{ text:c.title, color:'333333' }], { align: modern ? AlignmentType.LEFT : AlignmentType.CENTER }));
  kids.push(P([{ text:contactStr, color:'333333', size:Math.round(sz*.95) }], { align: modern ? AlignmentType.LEFT : AlignmentType.CENTER, after:80, border: modern ? undefined : { bottom:{ style:BorderStyle.SINGLE, size:12, color:acc, space:4 } } }));
  for (const sec of st.order) {
    if (st.hidden[sec]) continue;
    if (sec === 'summary') { if (S.summary.trim()) kids.push(H('Summary'), P([S.summary.trim()])); continue; }
    const items = vis(sec); if (!items.length) continue;
    kids.push(H(SECTIONS[sec].label));
    items.forEach(e => {
      if (sec === 'experience') kids.push(line(e.role, dates(e)), sub(e.company, e.location), ...bullets(e), P([''], { after:40 }));
      else if (sec === 'education') kids.push(line(e.school, dates(e)), sub([[e.degree,e.field].filter(Boolean).join(' in '), e.gpa?`GPA ${e.gpa}`:''].filter(Boolean).join(', '), e.location), ...bullets(e), P([''], { after:40 }));
      else if (sec === 'projects') kids.push(P([{ text:e.name, bold:true }, e.tech?{ text:`  |  ${e.tech}`, color:'333333' }:'', { text:`\t${dates(e)}`, color:'333333' }].filter(r=>r!==''), { tabs:true }), ...(e.link?[P([{ text:e.link.replace(/^https?:\/\//,''), italics:true, color:'333333' }])]:[]), ...bullets(e), P([''], { after:40 }));
      else if (sec === 'skills') kids.push(P([e.category?{ text:`${e.category}: `, bold:true }:'', e.items].filter(r=>r!==''), { after:20 }));
      else if (sec === 'certifications') kids.push(P([{ text:e.name, bold:true }, e.issuer?`, ${e.issuer}`:'', { text:`\t${e.date||''}`, color:'333333' }].filter(r=>r!==''), { tabs:true, after:20 }));
      else if (sec === 'involvement') kids.push(line(e.role, dates(e)), sub(e.org, e.location), ...bullets(e), P([''], { after:40 }));
    });
  }
  const doc = new Document({
    creator:'Folio', title:`${c.name} — Resume`,
    numbering:{ config:[{ reference:'b', levels:[{ level:0, format:LevelFormat.BULLET, text:'•', alignment:AlignmentType.LEFT, style:{ paragraph:{ indent:{ left:300, hanging:200 } } } }] }] },
    sections:[{ properties:{ page:{ size:{ width:12240, height:15840 }, margin:{ top:864, right:810, bottom:864, left:810 } } }, children:kids }],
  });
  const blob = await Packer.toBlob(doc);
  await deliver(fileBase() + '.docx', blob);
}

    else if (act === 'importText') { if (AI.available) AI.run('import', {}); else toast('AI import needs the Claude viewer; use Restore from backup instead.'); }
    else if (act === 'sample') { if (!S.contact.name || await ask('Load sample', 'Replace your current content with the sample resume?', 'Replace')) { S = JSON.parse(JSON.stringify(SAMPLE)); S.experience.forEach(x=>x.id=uid()); active='experience'; weakMarks = {}; commit(true); toast('Sample loaded'); } }
    else if (act === 'reset') { if (await ask('Clear everything', 'Delete all resume content? A backup (.json) is the only way to get it back.', 'Clear everything')) { S = blank(); weakMarks = {}; active = 'contact'; commit(true); toast('Cleared'); } }
  } catch (err) { console.error(err); toast('That export failed. Try Print › Save as PDF instead.'); }
};
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { try { const p = JSON.parse(r.result); if (!p.contact || !p.settings) throw 0; S = Object.assign(blank(), p); S.settings = Object.assign(blank().settings, p.settings); commit(true); toast('Backup restored'); } catch { toast('That file is not a Folio backup.'); } };
  r.readAsText(f); e.target.value = '';
};

/* --- mobile tabs --- */
$('#tabs').onclick = e => { const b = e.target.closest('[data-pane]'); if (!b) return; $$('#tabs button').forEach(x=>x.classList.toggle('on', x===b)); $('#work').classList.toggle('show-edit', b.dataset.pane==='edit'); $('#work').classList.toggle('show-pv', b.dataset.pane==='pv'); if (b.dataset.pane==='pv') requestAnimationFrame(scalePaper); };
window.addEventListener('afterprint', () => { if (!$('#tabs .on[data-pane="pv"]')) $('#work').classList.remove('show-pv'); });

/* =========================== init =========================== */
try { const t = localStorage.getItem('folio-theme'); if (t) document.documentElement.dataset.theme = t; } catch(_){}
load(); renderRail(); renderEditor(); renderPreview(); updateScore();
$('#aiMenuBtn').hidden = true;
(async () => {
  if (!window.claude?.use) return;
  try { AI.fn = await claude.use('sample'); } catch(_){}
  if (AI.fn) { AI.available = true; $('#aiMenuBtn').hidden = false; renderEditor(); }
  try { DL = await claude.use('downloads'); } catch(_){}
})();
</script>
</body>
